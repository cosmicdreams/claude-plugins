name: design-lab tests

on:
  pull_request:
    paths:
      - 'design-lab/**'
      - '.github/workflows/design-lab-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install test dependencies
        run: python -m pip install --quiet pillow
      - name: Run the design-lab tests
        working-directory: design-lab
        run: python -m unittest discover -s tests

  typescript:
    runs-on: ubuntu-latest
    env:
      DESIGN_LAB_CACHE: ${{ runner.temp }}/design-lab-cache
    defaults:
      run:
        working-directory: design-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned dependencies into shared cache
        run: npm run setup
      - name: Check generated contracts
        run: npm run contracts:check
      - name: Typecheck TypeScript source
        run: npm run typecheck
      - name: Run Node tests
        run: npm test

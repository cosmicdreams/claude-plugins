name: design-lab tests

on:
  pull_request:
    paths:
      - 'design-lab/**'
      - '.github/workflows/design-lab-tests.yml'

jobs:
  typescript:
    runs-on: ubuntu-latest
    env:
      DESIGN_LAB_CACHE: ${{ runner.temp }}/design-lab-cache
      DESIGN_LAB_HOME: ${{ runner.temp }}/design-lab-home
    defaults:
      run:
        working-directory: design-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned packages and Chromium into shared cache
        run: node scripts/setup-ts.ts --chromium
      - name: Install Chromium system libraries
        run: node scripts/setup-browser-deps.ts
      - name: Check generated contracts
        run: npm run contracts:check
      - name: Typecheck Node and Figma environments
        run: npm run typecheck
      - name: Run Node and browser tests
        run: npm test
      - name: Validate plugin and test mod when Claude Code is available
        run: |
          if command -v claude >/dev/null 2>&1; then
            claude plugin validate .
            node scripts/test-mod.ts
          else
            echo 'Claude Code is unavailable on this runner; validate and mod tests require the local Claude Code CLI. See TYPESCRIPT.md.'
          fi

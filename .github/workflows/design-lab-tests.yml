name: design-lab tests

on:
  pull_request:
    paths:
      - 'design-lab/**'
      - '.github/workflows/design-lab-tests.yml'

jobs:
  typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: design-lab
    steps:
      - uses: actions/checkout@v4
      - name: Configure isolated cache and home
        run: |
          echo "DESIGN_LAB_CACHE=$RUNNER_TEMP/design-lab-cache" >> "$GITHUB_ENV"
          echo "DESIGN_LAB_HOME=$RUNNER_TEMP/design-lab-home" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned packages and Chromium into shared cache
        run: node scripts/setup-ts.ts --chromium
      - name: Install Chromium system libraries
        run: node scripts/setup-browser-deps.ts
      - name: Check generated contracts
        run: npm run contracts:check
      - name: Typecheck Node and Figma environments
        run: npm run typecheck
      - name: Lint TypeScript
        run: npm run lint
      - name: Check TypeScript formatting
        run: npm run format:check
      - name: Run Node and browser tests
        run: npm test
      - name: Install Claude Code CLI
        run: npm install --global @anthropic-ai/claude-code@2.1.293
      - name: Validate plugin and test mod
        run: |
          command -v claude >/dev/null || { echo 'Claude Code CLI is missing after install; plugin validation cannot run.' >&2; exit 1; }
          claude --version
          claude plugin validate .
          node scripts/test-mod.ts

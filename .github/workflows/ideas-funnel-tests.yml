name: Ideas funnel tests
on:
  pull_request:
    paths:
      - 'ideas-funnel/**'
      - '.github/workflows/ideas-funnel-tests.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python3 -m pip install -r ideas-funnel/requirements.txt
      - run: python3 -m unittest discover -s ideas-funnel/tests -v

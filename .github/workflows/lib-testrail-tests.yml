name: Lib TestRail tests

on:
  pull_request:
    paths:
      - 'lib/skills/testrail/**'
      - 'lib/tests/test_testrail.py'
      - 'lib/skills/transcript/**'
      - 'lib/tests/test_transcript.py'
      - 'lib/skills/record-demo/**'
      - 'lib/tests/test_record_demo.py'
      - 'lib/hooks/upstream-post-guard.py'
      - 'lib/tests/test_upstream_post_guard.py'
      - '.github/workflows/lib-testrail-tests.yml'
  push:
    branches: [main]
    paths:
      - 'lib/skills/testrail/**'
      - 'lib/tests/test_testrail.py'
      - 'lib/skills/transcript/**'
      - 'lib/tests/test_transcript.py'
      - 'lib/skills/record-demo/**'
      - 'lib/tests/test_record_demo.py'
      - 'lib/hooks/upstream-post-guard.py'
      - 'lib/tests/test_upstream_post_guard.py'
      - '.github/workflows/lib-testrail-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg imagemagick fonts-dejavu-core
      - run: python3 -m unittest discover -s lib/tests -v
        env:
          REQUIRE_MEDIA_TOOLS: '1'

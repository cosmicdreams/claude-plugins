name: test-lab tests
on:
  pull_request:
    paths:
      - 'test-lab/**'
      - '.github/workflows/test-lab-tests.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python3 -m unittest discover -s test-lab/tests -v
